name: Предложить функцию
description: Предложите изменение или новую возможность.
title: "[Предложение]: "
labels: [enhancement]
body:
 - type: textarea
   id: problem
   attributes:
     label: Какую проблему это решает?
     description: Опишите текущий сценарий и его ограничения.
   validations:
     required: true
 - type: textarea
   id: solution
   attributes:
     label: Предлагаемое решение
     description: Опишите желаемое поведение и примеры CLI, если применимо.
   validations:
     required: true
 - type: textarea
   id: alternatives
   attributes:
     label: Альтернативы и дополнительные сведения
   validations:
     required: false
