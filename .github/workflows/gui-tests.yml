name: GUI smoke tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-smoke:
    name: PySide6 GUI / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # PySide6 needs the system EGL/OpenGL libraries even when tests use the offscreen Qt platform.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install optional GUI dependency
        run: python -m pip install --upgrade -r requirements-gui.txt
      - name: Run GUI smoke tests
        run: python -m unittest discover -s tests -p gui_smoke_tests.py -v
