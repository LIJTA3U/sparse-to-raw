name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify required binary test fixtures
        run: >-
          python -c "from pathlib import Path; files=['tests/fixtures/super_multi_extent.img','tests/fixtures/expected_system.img','tests/fixtures/expected_vendor.img']; missing=[p for p in files if not Path(p).is_file()]; print('Missing test fixtures:', ', '.join(missing)) if missing else print('All Super Image fixtures are present'); raise SystemExit(bool(missing))"
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -v
