name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify required Super Image test fixtures
        run: >-
          python -c "from pathlib import Path; names=('super_multi_extent.img','expected_system.img','expected_vendor.img'); root=Path('tests/fixtures'); missing=[name for name in names if not (root/name).is_file() or (root/name).stat().st_size == 0]; print('Missing or empty fixtures:', ', '.join(missing)) if missing else print('All required Super Image fixtures are present.'); raise SystemExit(bool(missing))"
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -v
