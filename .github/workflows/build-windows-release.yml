name: Build Windows applications

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release to attach the packages to
        required: true
        type: string
        default: v0.3.0
      source_ref:
        description: Branch, tag, or commit to build from (main includes the post-release test fixes)
        required: true
        type: string
        default: main

permissions:
  contents: write

jobs:
  build:
    name: Build Windows packages
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.release.tag_name }}

      - name: Resolve existing release
        id: target-release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!tag || !tag.trim()) {
              core.setFailed('Release tag is empty. Refusing to upload assets.');
              return;
            }
            // Require an existing release: never create a new version accidentally.
            const response = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            core.setOutput('tag_name', response.data.tag_name);
            core.setOutput('prerelease', String(response.data.prerelease));
            core.info(`Assets will be uploaded to existing release ${response.data.html_url}`);

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GUI and build dependencies
        run: python -m pip install --upgrade -r requirements-build.txt

      - name: Run core tests before packaging
        run: python -m unittest discover -s tests -p test_sparse_to_raw.py -v

      - name: Run GUI smoke tests before packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p gui_smoke_tests.py -v

      - name: Prepare PyInstaller build folders
        shell: pwsh
        run: |
          @("build/spec/cli", "build/spec/gui-folder", "build/spec/gui-onefile") | ForEach-Object {
            New-Item -ItemType Directory -Force -Path $_ | Out-Null
          }

      - name: Build CLI executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --name sparse-to-raw --distpath dist/cli --workpath build/cli
          --specpath build/spec/cli sparse_to_raw.py

      - name: Build GUI application folder
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name sparse-to-raw-gui --distpath dist/package --workpath build/gui-folder
          --specpath build/spec/gui-folder sparse_to_raw_gui.py

      - name: Zip GUI application folder
        shell: pwsh
        run: |
          $appFolder = "dist/package/sparse-to-raw-gui"
          if (-not (Test-Path -LiteralPath $appFolder -PathType Container)) {
            throw "GUI application folder was not created: $appFolder"
          }
          Compress-Archive -Path "$appFolder/*" -DestinationPath "dist/sparse-to-raw-gui-windows.zip" -Force

      - name: Build standalone GUI executable
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onefile
          --name sparse-to-raw-gui --distpath dist/onefile --workpath build/gui-onefile
          --specpath build/spec/gui-onefile sparse_to_raw_gui.py

      - name: Smoke-test bundled GUI without Python on PATH
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Remove only Python and Python/Scripts directories, preserving normal Windows PATH entries.
          $pythonDirs = @()
          if ($env:pythonLocation) {
            $pythonDirs += [System.IO.Path]::GetFullPath($env:pythonLocation).TrimEnd('\')
          }
          $pythonDirs += @(
            Get-Command python.exe -All -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandType -eq "Application" } |
              ForEach-Object { Split-Path -Parent $_.Source } |
              Where-Object { $_ } |
              ForEach-Object { [System.IO.Path]::GetFullPath($_).TrimEnd('\') }
          )
          $pythonDirs = @($pythonDirs | Sort-Object -Unique)
          $removePaths = @()
          foreach ($pythonDir in $pythonDirs) {
            $removePaths += $pythonDir
            $removePaths += (Join-Path $pythonDir "Scripts").TrimEnd('\')
          }
          $removePaths = @($removePaths | Sort-Object -Unique)
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $entry = $_.Trim().Trim('"')
            if (-not $entry) { return $false }
            $fullEntry = [System.IO.Path]::GetFullPath($entry).TrimEnd('\')
            foreach ($removePath in $removePaths) {
              if ([string]::Equals($fullEntry, $removePath, [System.StringComparison]::OrdinalIgnoreCase)) {
                return $false
              }
            }
            return $true
          }) -join ';'

          function Invoke-GuiSmokeTest {
            param(
              [Parameter(Mandatory = $true)]
              [string]$ExecutablePath,

              [Parameter(Mandatory = $true)]
              [string]$Label
            )

            if (-not (Test-Path -LiteralPath $ExecutablePath -PathType Leaf)) {
              throw "$Label executable was not found: $ExecutablePath"
            }

            $resolvedPath = (Resolve-Path -LiteralPath $ExecutablePath).Path
            $logPath = Join-Path $env:TEMP "sparse-to-raw-gui-self-test.log"

            if (Test-Path -LiteralPath $logPath) {
              Remove-Item -LiteralPath $logPath -Force
            }

            Write-Host "Running $Label self-test: $resolvedPath"

            try {
              $process = Start-Process -FilePath $resolvedPath -ArgumentList @("--self-test") -WorkingDirectory (Get-Location).Path -PassThru -Wait -ErrorAction Stop
              $exitCode = $process.ExitCode
            }
            catch {
              Write-Host "Failed to start or wait for $Label executable."
              Write-Host $_.Exception.ToString()
              throw
            }

            Write-Host "$Label GUI self-test exit code: $exitCode"

            if ($exitCode -ne 0) {
              if (Test-Path -LiteralPath $logPath -PathType Leaf) {
                Write-Host "----- GUI self-test diagnostic log -----"
                Get-Content -LiteralPath $logPath -Raw
                Write-Host "----------------------------------------"
              } else {
                Write-Host "No diagnostic file was created: $logPath"
              }

              throw "$Label GUI smoke test failed with exit code $exitCode"
            }

            Write-Host "$Label GUI smoke test passed."
          }

          Invoke-GuiSmokeTest -ExecutablePath "dist/package/sparse-to-raw-gui/sparse-to-raw-gui.exe" -Label "Folder-package"
          Invoke-GuiSmokeTest -ExecutablePath "dist/onefile/sparse-to-raw-gui.exe" -Label "One-file"
          
      - name: Verify release files exist
        shell: pwsh
        run: |
          $files = @(
            "dist/cli/sparse-to-raw.exe",
            "dist/onefile/sparse-to-raw-gui.exe",
            "dist/sparse-to-raw-gui-windows.zip"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Expected release asset is missing: $file"
            }
            if ((Get-Item -LiteralPath $file).Length -le 0) {
              throw "Expected release asset is empty: $file"
            }
            Write-Host ("Verified {0} ({1} bytes)" -f $file, (Get-Item -LiteralPath $file).Length)
          }

      - name: Upload build artifacts for inspection
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sparse-to-raw-windows-packages
          path: |
            dist/cli/sparse-to-raw.exe
            dist/onefile/sparse-to-raw-gui.exe
            dist/sparse-to-raw-gui-windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload files to existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target-release.outputs.tag_name }}
          prerelease: ${{ steps.target-release.outputs.prerelease }}
          files: |
            dist/cli/sparse-to-raw.exe
            dist/onefile/sparse-to-raw-gui.exe
            dist/sparse-to-raw-gui-windows.zip
          fail_on_unmatched_files: true
          overwrite_files: true
