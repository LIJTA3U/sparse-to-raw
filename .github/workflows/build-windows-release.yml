name: Build Windows applications

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GUI and build dependencies
        run: python -m pip install --upgrade -r requirements-build.txt
      - name: Run core tests before packaging
        run: python -m unittest discover -s tests -p test_sparse_to_raw.py -v
      - name: Prepare PyInstaller build folders
        shell: pwsh
        run: |
          @("build/spec/cli", "build/spec/gui-folder", "build/spec/gui-onefile") | ForEach-Object {
            New-Item -ItemType Directory -Force -Path $_ | Out-Null
          }
      - name: Build CLI executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --name sparse-to-raw --distpath dist/cli --workpath build/cli
          --specpath build/spec/cli sparse_to_raw.py
      - name: Build GUI application folder
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name sparse-to-raw-gui --distpath dist/package --workpath build/gui-folder
          --specpath build/spec/gui-folder sparse_to_raw_gui.py
      - name: Zip GUI application folder
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/package/sparse-to-raw-gui/*" -DestinationPath "dist/sparse-to-raw-gui-windows.zip" -Force
      - name: Build standalone GUI executable
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onefile
          --name sparse-to-raw-gui --distpath dist/onefile --workpath build/gui-onefile
          --specpath build/spec/gui-onefile sparse_to_raw_gui.py
      - name: Smoke-test bundled GUI without Python on PATH
        shell: pwsh
        run: |
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
          $env:QT_QPA_PLATFORM = "offscreen"
          & ".\dist\package\sparse-to-raw-gui\sparse-to-raw-gui.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Folder-package GUI smoke test failed with exit code $LASTEXITCODE" }
          & ".\dist\onefile\sparse-to-raw-gui.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "One-file GUI smoke test failed with exit code $LASTEXITCODE" }
      - name: Upload files to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cli/sparse-to-raw.exe
            dist/sparse-to-raw-gui-windows.zip
            dist/onefile/sparse-to-raw-gui.exe
      - name: Upload build artifacts for manual runs
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: sparse-to-raw-windows
          path: |
            dist/cli/sparse-to-raw.exe
            dist/sparse-to-raw-gui-windows.zip
            dist/onefile/sparse-to-raw-gui.exe
          if-no-files-found: error
