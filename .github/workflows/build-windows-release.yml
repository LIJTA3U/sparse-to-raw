name: Build Windows executable

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tool
        run: python -m pip install --upgrade pyinstaller
      - name: Build single-file executable
        run: pyinstaller --clean --onefile --name sparse-to-raw sparse_to_raw.py
      - name: Upload executable to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sparse-to-raw.exe

      - name: Upload executable for manual runs
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: sparse-to-raw-windows
          path: dist/sparse-to-raw.exe
          if-no-files-found: error
